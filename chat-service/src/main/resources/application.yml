spring:
  application:
    name: chat-service

  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_SHUTDOWN_TIMEOUT:210s}

  web:
    cors:
      mapping: "/**"
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
      allowed-headers: ${CORS_ALLOWED_HEADERS:*}
      exposed-headers: Authorization
      allow-credentials: true
      max-age: ${CORS_MAX_AGE:86400}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chat_db}?sslmode=disable
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: ${SHOW_SQL:false}
    open-in-view: false

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/dalai-llama}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8080/realms/dalai-llama/protocol/openid-connect/certs}}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

chat:
  llm-gateway:
    base-url: ${LLM_GATEWAY_BASE_URL:http://llm-gateway.apps.svc.cluster.local:8080}
    timeout-ms: ${LLM_GATEWAY_TIMEOUT_MS:120000}
    default-text-model: ${CHAT_DEFAULT_TEXT_MODEL:gemini-2.5-flash}
    default-embedding-model: ${CHAT_DEFAULT_EMBEDDING_MODEL:text-embedding-004}
  trend-intelligence:
    base-url: ${TREND_INTELLIGENCE_BASE_URL:http://trend-intelligence-service.apps.svc.cluster.local:8080}
    timeout-ms: ${TREND_INTELLIGENCE_TIMEOUT_MS:60000}
  creative-planning:
    base-url: ${CREATIVE_PLANNING_BASE_URL:http://creative-planning-service.apps.svc.cluster.local:8080}
    timeout-ms: ${CREATIVE_PLANNING_TIMEOUT_MS:60000}
  pre-production:
    base-url: ${PRE_PRODUCTION_SERVICE_BASE_URL:http://pre-production-service.apps.svc.cluster.local:8080}
    timeout-ms: ${PRE_PRODUCTION_SERVICE_TIMEOUT_MS:30000}
