spring:
  application:
    name: agent-service
  server:
    port: 8080
    shutdown: graceful
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:agent_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:kafka.platform.svc.cluster.local:9092}
    topics:
      kamailio-registration-events: ${KAFKA_REG_TOPIC:pbx-registration-events}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:agent-service-${spring.application.instance_id:default}}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        max.poll.records: 100
        max.poll.interval.ms: 300000
        session.timeout.ms: 45000
        heartbeat.interval.ms: 15000

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        linger.ms: 10
        batch.size: 16384
        compression.type: snappy
        max.in.flight.requests.per.connection: 5
        enable.idempotence: true

    listener:
      ack-mode: manual
      concurrency: 3

  # Redis for session management
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms
        shutdown-timeout: 100ms

  # Security - OAuth2 Resource Server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.platform.svc.cluster.local/realms/master}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak.platform.svc.cluster.local/realms/master/protocol/openid-connect/certs}

# Application-specific configuration
app:
  tenant:
    id: ${TENANT_ID:default}
#            - name: RTP_TOPIC
  #              value: "${RTP_TOPIC}"
  #            - name: AI_RESULT_TOPIC
  #              value: "${AI_RESULT_TOPIC}"
  #            - name: WS_PORT
  #              value: "8080"
  #            - name: TENANT_ID
  #              value: "${TENANT_ID}"
  #            - name: KAFKA_BROKER
  #              # NOTE: Changed from KAFKA_BROKER to KAFKA_BROKERS to match the variable in your Java code
  #              value: "${KAFKA_BROKERS}"
  #            - name: REDIS_URL # <-- **NEW**
  #              value: "${REDIS_URL}"
  #            - name: KAFKA_REG_TOPIC # <-- **NEW**
  #              value: "${KAFKA_REG_TOPIC}"
  #            - name: KAFKA_CALL_TOPIC # <-- **NEW**
  #              value: "${KAFKA_CALL_TOPIC}"
  kafka:
    consumer-group: ${KAFKA_CONSUMER_GROUP:agent-service-reg}
    topics:
      # Inbound topics (consumed)
      assignment-requests: agent.assign.requests
      rtp-voice-frames: ${RTP_TOPIC}
      ai-transcripts: ${AI_RESULT_TOPIC}
      call-events: ${KAFKA_CALL_TOPIC}
      reg-events: ${KAFKA_REG_TOPIC}

      # Outbound topics (produced)
      assignment-responses: agent.assign.responses
      agent-events: agent.events.${app.tenant.id}
      agent-audio-out: agent.audio.out.${app.tenant.id}
      agent-commands: agent.commands.${app.tenant.id}

  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:3000,https://*.dalaillama.in}
    message-size-limit: 65536
    send-time-limit: 20000
    send-buffer-size: 524288

  webrtc:
    stun-servers:
      - stun:stun.l.google.com:19302
      - stun:stun1.l.google.com:19302
    turn-server:
      urls: ${TURN_SERVER_URL:turn:coturn.${app.tenant.id}.svc.cluster.local:3478}
      username: ${TURN_USERNAME:default}
      credential: ${TURN_CREDENTIAL:secret}

  agent:
    assignment:
      strategy: ${ASSIGNMENT_STRATEGY:SKILL_BASED} # Options: ROUND_ROBIN, LEAST_ACTIVE, SKILL_BASED, QUEUE_BASED
      timeout-seconds: 30
      max-concurrent-calls: 5

    session:
      idle-timeout-minutes: 30
      heartbeat-interval-seconds: 15
      max-duration-hours: 12

  metrics:
    custom:
      enabled: true

  health:
    check-interval-seconds: 30

# Management & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway,loggers
      base-path: /actuator

  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true

  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    kafka:
      enabled: true
    db:
      enabled: true
    redis:
      enabled: true

  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
    tags:
      application: ${spring.application.name}
      tenant: ${app.tenant.id}

  tracing:
    sampling:
      probability: 0.1

# Logging
logging:
  level:
    root: INFO
    com.dalai.llama.agent: DEBUG
    org.springframework.kafka: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/agent-service/application.log
    max-size: 10MB
    max-history: 30

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.dalai.llama.agent: DEBUG
    org.springframework.security: DEBUG
    org.springframework.kafka: DEBUG

app:
  websocket:
    allowed-origins: "*"

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.dalai.llama.agent: INFO
    org.springframework.kafka: WARN

management:
  tracing:
    sampling:
      probability: 0.5
