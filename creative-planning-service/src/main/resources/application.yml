spring:
  application:
    name: creative-planning-service

  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_SHUTDOWN_TIMEOUT:210s}

  codec:
    # Spring WebFlux's injected WebClient.Builder defaults to a 256KB in-memory response buffer --
    # raised repo-wide alongside every other LlmGatewayClient after finding this was the real cause
    # of a silent image-generation failure in pre-production-service. 16MB matches creator-service's
    # own GoogleGenAiClientFactory.
    max-in-memory-size: 16MB

  servlet:
    multipart:
      max-file-size: ${CREATIVE_PLANNING_MAX_UPLOAD_SIZE_MB:25}MB
      max-request-size: ${CREATIVE_PLANNING_MAX_UPLOAD_SIZE_MB:25}MB

  web:
    cors:
      mapping: "/**"
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
      allowed-headers: ${CORS_ALLOWED_HEADERS:*}
      exposed-headers: Authorization
      allow-credentials: true
      max-age: ${CORS_MAX_AGE:86400}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:creative_planning_db}?sslmode=disable
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: ${SHOW_SQL:false}
    open-in-view: false

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: creative-planning-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/dalai-llama}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8080/realms/dalai-llama/protocol/openid-connect/certs}}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

creative-planning:
  llm-gateway:
    base-url: ${LLM_GATEWAY_BASE_URL:http://llm-gateway.apps.svc.cluster.local:8080}
    timeout-ms: ${LLM_GATEWAY_TIMEOUT_MS:120000}
    default-text-model: ${CREATIVE_PLANNING_DEFAULT_TEXT_MODEL:gemini-2.5-flash}
  critic:
    # The marketing-plan pre-flight harness lives in critic-service, not here -- see
    # MarketingPlanCriticServiceClient. Same mandatory-gate discipline pre-production-service
    # already uses for shot critiques: no bypass flag.
    base-url: ${CRITIC_SERVICE_BASE_URL:http://critic-service.apps.svc.cluster.local:8080}
    timeout-ms: ${CRITIC_SERVICE_TIMEOUT_MS:120000}
  chat:
    # Best-effort push of finalized marketing plans into chat-service's central embedding index
    # -- see ChatServiceClient's javadoc. Unlike critic, never gates generation on success.
    base-url: ${CHAT_SERVICE_BASE_URL:http://chat-service.apps.svc.cluster.local:8080}
    timeout-ms: ${CHAT_SERVICE_TIMEOUT_MS:30000}
  pre-production:
    # Where a locked idea gets handed off to become a real project (POST
    # /v1/projects/from-locked-idea) -- see PreProductionServiceClient. Unlike chat, this one
    # gates: a failure here fails the lock request.
    base-url: ${PRE_PRODUCTION_SERVICE_BASE_URL:http://pre-production-service.apps.svc.cluster.local:8080}
    timeout-ms: ${PRE_PRODUCTION_SERVICE_TIMEOUT_MS:30000}
  billing:
    # Prices a standalone requirement's duration (platform per-second rate + this creator's own
    # margin) at creation time -- see BillingServiceClient. Gates the same way pre-production
    # does: a standalone brief always needs a real price, so a billing-service failure here fails
    # the create request rather than saving an unpriced requirement.
    base-url: ${BILLING_SERVICE_BASE_URL:http://billing-service.apps.svc.cluster.local:8080}
    # 30s, not 15s: this call goes all the way out to Razorpay's live API (order creation), not
    # just to another internal service -- 15s clipped real, eventually-successful calls under
    # normal latency variance, timing out the client-facing request while billing-service's own
    # call to Razorpay kept running server-side. Matches pre-production's own cross-service budget
    # above.
    timeout-ms: ${BILLING_SERVICE_TIMEOUT_MS:30000}
  share-token:
    # How long a project-requirement share link stays live before the public GET/mark-funded
    # routes refuse it -- refreshShareToken() issues a new one when a client didn't pay in time.
    ttl-days: ${CREATIVE_PLANNING_SHARE_TOKEN_TTL_DAYS:7}
  payment-webhook:
    # Blank by default -- no payment gateway is integrated yet, so the public mark-funded route
    # rejects every call until this is set to a real secret shared with an actual payment
    # provider's webhook. The share token itself is never sufficient authorization to mark
    # something funded (see ProjectRequirementService's javadoc).
    secret: ${CREATIVE_PLANNING_PAYMENT_WEBHOOK_SECRET:}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio.infra.svc.cluster.local:9000}
    # Presigned URLs are signed against whatever endpoint generated them (the Host header is part
    # of the AWS SigV4 signature) -- the internal-only cluster hostname above can't be swapped in
    # after the fact, so a second client signs against this public route instead. Same pattern as
    # pre-production-service's publicMinioClient. Blank falls back to the internal endpoint
    # (local/dev, where there's no public route to presign against).
    public-url: ${MINIO_PUBLIC_URL:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${CREATIVE_PLANNING_BUCKET:creator-assets}
    reference-image-prefix: ${CREATIVE_PLANNING_REFERENCE_IMAGE_PREFIX:creative-planning-reference-images}
    export-prefix: ${CREATIVE_PLANNING_EXPORT_PREFIX:creative-planning-exports}
    requirement-attachment-prefix: ${CREATIVE_PLANNING_REQUIREMENT_ATTACHMENT_PREFIX:creative-planning-requirement-attachments}
    max-upload-size-mb: ${CREATIVE_PLANNING_MAX_UPLOAD_SIZE_MB:25}
