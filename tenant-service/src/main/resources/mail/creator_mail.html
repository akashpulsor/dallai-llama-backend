<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{subject}}</title></head>
<body style="margin:0;padding:0">
<div style="display:none;max-height:0;overflow:hidden;opacity:0">{{preheader}}</div>
<div style="max-width:600px;padding:16px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.55;color:#222222">
<p style="margin:0 0 14px">{{greeting}}</p>
<p style="margin:0 0 14px">{{intro}}</p>
{{{noteHtml}}}
{{{filmsHtml}}}
<p style="margin:0 0 14px">{{ask}}</p>
{{{requestHtml}}}
<p style="margin:18px 0 0">{{creatorName}}<br><a href="{{profileUrl}}" target="_blank" rel="noopener noreferrer" style="color:#666666">See all my work</a></p>
<p style="margin:28px 0 0;font-size:12px;color:#888888">Sent through Dalai Llama. You'll get at most one email a day from creators here. <a href="{{unsubscribeUrl}}" style="color:#888888">Unsubscribe</a></p>
</div>
{{{openPixelHtml}}}
</body></html>
