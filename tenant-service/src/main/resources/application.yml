spring:
  application:
    name: tenant-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tenant_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: tenant-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://auth.localhost:8081/realms/dalaillama}

# Keycloak Admin Client
keycloak:
  admin:
    url: ${KEYCLOAK_ADMIN_URL:http://auth.localhost:8081}
    realm: master
    client-id: admin-cli
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

# Kubernetes Client
kubernetes:
  master-url: ${KUBERNETES_MASTER_URL:https://127.0.0.1:6443}
  namespace: ${KUBERNETES_NAMESPACE:dalai-llama}
  trust-certs: ${KUBERNETES_TRUST_CERTS:true}

# Internal Service URLs
services:
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  billing:
    url: ${BILLING_SERVICE_URL:http://localhost:8083}

# Provisioning Configuration
provisioning:
  max-retries: ${PROVISIONING_MAX_RETRIES:3}
  retry-delay-seconds: ${PROVISIONING_RETRY_DELAY_SECONDS:10}
  ip-wait-timeout-minutes: ${PROVISIONING_IP_WAIT_TIMEOUT_MINUTES:10}
  ip-poll-interval-seconds: ${PROVISIONING_IP_POLL_INTERVAL_SECONDS:10}
  min-wallet-balance: ${PROVISIONING_MIN_WALLET_BALANCE:1000}

# Health Check Scheduler
health-check:
  enabled: true
  interval-seconds: 60
  failure-threshold: 3

# Server Configuration
server:
  port: ${SERVER_PORT:8091}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Logging
logging:
  level:
    com.dalai.llama.tenant: DEBUG
    org.springframework.security: DEBUG
    io.fabric8.kubernetes: DEBUG