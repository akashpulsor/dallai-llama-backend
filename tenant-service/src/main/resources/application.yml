spring:
  application:
    name: tenant-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tenant_db}?sslmode=disable
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  web:
    cors:
      mapping: "/**"
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
      allowed-headers: ${CORS_ALLOWED_HEADERS:*}
      max-age: ${CORS_MAX_AGE:86400}
      exposed-headers: Authorization,Content-Disposition
      allow-credentials: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: tenant-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://auth.localhost:8081/realms/dalaillama}

  # ================================================================
  # KAMAILIO DATABASE (Separate datasource)
  # ================================================================
  kamailio-datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${KAMAILIO_DB_NAME:kamailio_db}?sslmode=disable
    username: ${DB_USERNAME:kamailio}
    password: ${DB_PASSWORD:kamailio}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2


# ================================================================
# TELECOM STACK IMAGES
# ================================================================
telecom:
  images:
    agent-ui: ${IMAGE_AGENT_UI:dalaillama/agent-ui:latest}
    admin-ui: ${IMAGE_ADMIN_UI:dalaillama/admin-ui:latest}
    supervisor-ui: ${IMAGE_SUPERVISOR_UI:dalaillama/supervisor-ui:latest}
    ivr-builder: ${IMAGE_IVR_BUILDER:dalaillama/ivr-builder:latest}
    pbx-core: ${IMAGE_PBX_CORE:dalaillama/pbx-core:latest}
    agent-service: ${IMAGE_AGENT_SERVICE:dalaillama/agent-service:latest}
    ai-service: ${IMAGE_AI_SERVICE:dalaillama/ai-service:latest}
    kamailio: ${IMAGE_KAMAILIO:dalaillama/kamailio:5.7}
    freeswitch: ${IMAGE_FREESWITCH:dalaillama/freeswitch:1.10}
    rtpengine: ${IMAGE_RTPENGINE:dalaillama/rtpengine:latest}
    coturn: ${IMAGE_COTURN:coturn/coturn:latest}

# ================================================================
# KEYCLOAK CONFIGURATION
# ================================================================
keycloak:
  admin:
    url: ${KEYCLOAK_ADMIN_URL:http://auth.localhost:8081}
    realm: master
    orchestrator:
      client-id: platform-orchestrator
      client-secret: ${KEYCLOAK_CLIENT_SECRET:PYJhT5PhZVZzVo81I2E5bNaKtDXC8hPA}

# ================================================================
# KUBERNETES CLIENT
# ================================================================
kubernetes:
  master-url: ${KUBERNETES_MASTER_URL:https://127.0.0.1:6443}
  namespace: ${KUBERNETES_NAMESPACE:apps}
  trust-certs: ${KUBERNETES_TRUST_CERTS:true}

# ================================================================
# INTERNAL SERVICE URLs
# ================================================================
services:
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  billing:
    url: ${BILLING_SERVICE_URL:http://localhost:8083}
  didww:
    url: ${DIDWW_SERVICE_URL:http://didww-service:8080}

# ================================================================
# GATEWAY CONFIGURATION
# ================================================================
gateway:
  ref: ${GATEWAY_REF:istio-system/central-gateway}

# ================================================================
# CLUSTER CONFIGURATION
# ================================================================
cluster:
  issuer: ${CLUSTER_ISSUER:letsencrypt-prod}

ingress:
  class: ${INGRESS_CLASS:nginx}

# ================================================================
# PROVISIONING CONFIGURATION
# ================================================================
provisioning:
  max-retries: ${PROVISIONING_MAX_RETRIES:3}
  retry-delay-seconds: ${PROVISIONING_RETRY_DELAY_SECONDS:10}
  ip-wait-timeout-minutes: ${PROVISIONING_IP_WAIT_TIMEOUT_MINUTES:10}
  ip-poll-interval-seconds: ${PROVISIONING_IP_POLL_INTERVAL_SECONDS:10}
  min-wallet-balance: ${PROVISIONING_MIN_WALLET_BALANCE:1000}

# ================================================================
# HEALTH CHECK SCHEDULER
# ================================================================
health-check:
  enabled: true
  interval-seconds: 60
  failure-threshold: 3

# ================================================================
# SERVER CONFIGURATION
# ================================================================
server:
  port: ${SERVER_PORT:8091}

# ================================================================
# ACTUATOR
# ================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# ================================================================
# LOGGING
# ================================================================
logging:
  level:
    com.dalai.llama.tenant: DEBUG
    com.dalai.llama.tenant.service.provisioning: DEBUG
    org.springframework.security: DEBUG
    io.fabric8.kubernetes: DEBUG

---
# ================================================================
# PRODUCTION PROFILE
# ================================================================
spring:
  config:
    activate:
      on-profile: production

dalaillama:
  domain: dalaillama-dev.local:8443

  shared:
    postgres:
      host: postgres-primary.dalaillama.svc.cluster.local
    redis:
      host: redis-master.dalaillama.svc.cluster.local
    kafka:
      bootstrap: kafka-0.kafka-headless.dalaillama.svc.cluster.local:9092,kafka-1.kafka-headless.dalaillama.svc.cluster.local:9092

logging:
  level:
    com.dalai.llama.tenant: INFO
    org.springframework.security: WARN
    io.fabric8.kubernetes: WARN