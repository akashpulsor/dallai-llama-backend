spring:
  application:
    name: tenant-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tenant_db}?sslmode=disable
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  web:
    cors:
      mapping: "/**"
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
      allowed-headers: ${CORS_ALLOWED_HEADERS:*}
      max-age: ${CORS_MAX_AGE:86400}
      exposed-headers: Authorization,Content-Disposition
      allow-credentials: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: tenant-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://auth.localhost:8081/realms/dalaillama}


# ════════════════════════════════════════════════════════════
# ADD THESE SECTIONS TO YOUR application.yaml
# ════════════════════════════════════════════════════════════

# ================================================================
# DALAI LLAMA PLATFORM CONFIG
# ================================================================
dalaillama:
  domain: ${BASE_DOMAIN:dalaillama.in}
  shared-namespace: ${SHARED_NAMESPACE:apps}

  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio.infra.svc.cluster.local:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-prefix: ${MINIO_BUCKET_PREFIX:dl}

  ai-service:
    url: ${AI_SERVICE_URL:http://ai-service.apps.svc.cluster.local:8601}
    ws-url: ${AI_SERVICE_WS_URL:ws://ai-service.apps.svc.cluster.local:8601}
    rtp-host: ${AI_SERVICE_RTP_HOST:ai-service.apps.svc.cluster.local}
    rtp-port: ${AI_SERVICE_RTP_PORT:5555}

  pbx-core:
    url: ${PBX_CORE_URL:http://pbx-core.apps.svc.cluster.local:8080}

  istio:
    gateway-name: ${ISTIO_GATEWAY_NAME:central-gateway}
    gateway-namespace: ${ISTIO_GATEWAY_NAMESPACE:istio-system}
    vs-name: ${ISTIO_VS_NAME:tenant-routes}
    reconcile-interval-ms: ${ISTIO_RECONCILE_INTERVAL:300000}



# ================================================================
# KUBERNETES (for Istio reconciler)
# ================================================================
kubernetes:
  master-url: ${K8S_MASTER_URL:}
  namespace: ${K8S_NAMESPACE:apps}
  trust-certs: ${K8S_TRUST_CERTS:true}

# Under existing 'spring.datasource:' — no change needed.
# MinIO uses S3 SDK, not spring datasource.
# ================================================================
# KEYCLOAK ADMIN (for realm management)
# ================================================================
keycloak:
  admin:
    url: ${KEYCLOAK_ADMIN_URL:http://auth.localhost:8081}
    realm: ${KEYCLOAK_ADMIN_REALM:master}
    orchestrator:
      client-id: ${KEYCLOAK_CLIENT_ID:platform-api}
      client-secret: ${KEYCLOAK_CLIENT_SECRET:}
  platform-realm: ${KEYCLOAK_REALM:dalai-llama}
# ================================================================
# INTERNAL SERVICE URLs
# ================================================================
services:
  billing:
    url: ${BILLING_SERVICE_URL:http://localhost:8083}

  product:
    url: ${PRODUCT_SERVICE_URL:http://product-service:8080}
# ================================================================
# SERVER
# ================================================================
server:
  port: ${SERVER_PORT:8091}

# ================================================================
# ACTUATOR
# ================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# ================================================================
# LOGGING
# ================================================================
logging:
  level:
    com.dalai.llama.tenant: DEBUG
    org.springframework.security: DEBUG