spring:
  application:
    name: billing-service

  # Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:billing_db}?sslmode=disable
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: ${SHOW_SQL:false}

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: billing-service
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  # Security (OAuth2/JWT)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/dalai-llama}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8080/realms/dalai-llama/protocol/openid-connect/certs}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
  max-age: ${CORS_MAX_AGE:86400}

# Razorpay Configuration
razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_xxxxx}
  key-secret: ${RAZORPAY_KEY_SECRET:xxxxx}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:xxxxx}
  mock-enabled: ${RAZORPAY_MOCK_ENABLED:true}
# Billing Configuration
billing:
  creator-video-package:
    ai-short-starter-price-inr: ${CREATOR_VIDEO_PACKAGE_AI_SHORT_STARTER_PRICE_INR:5999}
  # Client pay-to-lock pricing. platform-base is what the platform keeps (covers COGS + opex +
  # profit); the creator's own Tenant.marginPercent rides on top and is credited to their wallet.
  # Defaults land a typical order at ~INR 6,499 client-facing (competitor-validated), of which the
  # platform keeps 5,299 and the creator earns ~1,200. All configurable, no redeploy to tune.
  client-review:
    platform-base-inr: ${CLIENT_REVIEW_PLATFORM_BASE_INR:5299}
    default-creator-margin-percent: ${CLIENT_REVIEW_DEFAULT_CREATOR_MARGIN_PERCENT:22.6}
    currency: ${CLIENT_REVIEW_CURRENCY:INR}
  # Only used for the webhook-driven client-review-payment safety net (see
  # ClientReviewPaymentService#captureFromWebhook / PreProductionServiceClient) -- nothing else in
  # billing-service calls pre-production-service.
  pre-production:
    base-url: ${PRE_PRODUCTION_SERVICE_BASE_URL:http://pre-production-service.apps.svc.cluster.local:8080}
    timeout-ms: ${PRE_PRODUCTION_SERVICE_TIMEOUT_MS:15000}
  grace-period-days: ${GRACE_PERIOD_DAYS:7}
  low-balance-threshold: ${LOW_BALANCE_THRESHOLD:500}
  default-currency: ${DEFAULT_CURRENCY:INR}
  kafka:
    creator-billing-events-topic: ${CREATOR_KAFKA_BILLING_EVENTS_TOPIC:creator.billing.events}
    llm-billing-events-topic: ${LLM_KAFKA_BILLING_EVENTS_TOPIC:llm.billing.events}
  currency:
    conversion-rates: ${BILLING_CURRENCY_CONVERSION_RATES:INR_INR=1,USD_INR=95}
  # Applied on top of llm-gateway's raw per-call cost (see LlmBillingEventConsumer) -- llm-gateway
  # deliberately reports raw provider cost only, pricing/margin is billing-service's job. 85 matches
  # the one real precedent for this exact number in this codebase (creator-service's now-dead
  # usage-markup-percent); adjust freely, this isn't derived from anything more authoritative.
  llm-usage-margin-percent: ${LLM_USAGE_MARGIN_PERCENT:85}
  # Only used to resolve a project's quoted price for the spend cap below -- nothing else in
  # billing-service calls creative-planning-service.
  creative-planning:
    base-url: ${CREATIVE_PLANNING_SERVICE_BASE_URL:http://creative-planning-service.apps.svc.cluster.local:8080}
    timeout-ms: ${CREATIVE_PLANNING_SERVICE_TIMEOUT_MS:5000}
  # A project's real accumulated cost (summed from usage_records) may exceed its quoted price by
  # up to this multiple before new generation is refused -- 150% leaves room for a normal retry or
  # two without silently blocking a barely-over-budget project, while still guaranteeing a runaway
  # one (regenerating the same shot repeatedly) can't erase the platform's margin on a single deal.
  project-spend-cap-multiple: ${PROJECT_SPEND_CAP_MULTIPLE:1.5}

# Service URLs (for internal communication)
services:
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  tenant:
    url: ${TENANT_SERVICE_URL:http://localhost:8081}
  billing:
    url: ${BILLING_SERVICE_URL:http://localhost:8081}
# Server Configuration
server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /

# Actuator & Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

# Logging
logging:
  level:
    root: INFO
    com.dalai.llama.billing: ${LOG_LEVEL:DEBUG}
    org.springframework.security: INFO
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/billing_db
    username: postgres
    password: postgres

  kafka:
    bootstrap-servers: localhost:9092

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    show-sql: true

logging:
  level:
    com.dalai.llama.billing: DEBUG
    org.hibernate.SQL: DEBUG

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.dalai.llama.billing: INFO

---
# Test Profile
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false
