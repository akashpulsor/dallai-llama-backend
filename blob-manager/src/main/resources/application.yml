spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:blobmgr}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASS:root}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:kafka.platform.svc.cluster.local:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

blob:
  watch-dir: ${WATCH_DIR:/var/spool/rtpengine/recordings}
  poll-interval-sec: ${POLL_INTERVAL:5}
  backend: ${STORAGE_BACKEND:s3}
kafka:
  topic-prefix: ${KAFKA_TOPIC_PREFIX:cdr.recording}

management:
  endpoints:
    web:
      exposure:
        include: health,info
