## For test
dalai.llama.app.jwtExpirationMs= 86400000
dalai.llama.app.jwtRefreshExpirationMs= 86400000


twilio.account.sid=YOUR_MASTER_ACCOUNT_SID
twilio.auth.token=YOUR_MASTER_AUTH_TOKEN
logging.level.org.springframework.boot.crm.service= DEBUG


// 4. In application.properties
spring.mvc.contentnegotiation.favor-parameter=false
spring.mvc.contentnegotiation.favor-path-extension=false
spring.mvc.contentnegotiation.default-content-type=application/json
