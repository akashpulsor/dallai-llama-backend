server:
  port: 9080

spring:
  datasource:
    # Connects to MySQL using environment variables set in the Kubernetes deployment
    url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  kafka:
    # Kafka brokers loaded from the KAFKA_BROKERS environment variable
    bootstrap-servers: ${KAFKA_BROKERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  redis:
    # Redis host loaded from the REDIS_HOST environment variable
    host: ${REDIS_HOST}
    port: 6379
  flyway:
    url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    user: ${DB_USER}
    password: ${DB_PASSWORD}

registry:
  container: docker.io/dalaillama

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

pbx:
  ai:
    routing:
      timeout-ms: 60
  core:
    # Service URL dynamically loaded from the PBX_CORE_URL environment variable (the FQDN of this service)
    url: ${PBX_CORE_URL}