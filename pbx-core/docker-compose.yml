services:
  mysql:
    image: mysql:8.0
    container_name: pbx-mysql
    restart: unless-stopped
    command: --lower_case_table_names=1 --bind-address=0.0.0.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pbx_core
      MYSQL_USER: pbx
      MYSQL_PASSWORD: pbx123
    ports:
      - "3306:3306"

    volumes:
      - pbx_mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: pbx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pbx_redis_data:/data

  kafka:
    image: apache/kafka:latest
    container_name: pbx-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@pbx-kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://pbx-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    volumes:
      - pbx_kafka_data:/var/lib/kafka

  pbx-core:
    build: .
    container_name: pbx-core
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - kafka
    environment:
      DB_HOST: mysql
      DB_NAME: pbx_core
      DB_USER: pbx
      DB_PASSWORD: pbx123

      REDIS_HOST: redis

      KAFKA_BROKERS: pbx-kafka:9092

      PBX_CORE_URL: http://pbx-core:8080
    ports:
      - "8080:8080"

volumes:
  pbx_mysql_data:
  pbx_redis_data:
  pbx_kafka_data:
