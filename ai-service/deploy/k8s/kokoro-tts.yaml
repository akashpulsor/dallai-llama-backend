apiVersion: apps/v1
kind: Deployment
metadata:
  name: kokoro-tts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kokoro-tts
  template:
    metadata:
      labels:
        app: kokoro-tts
    spec:
      containers:
        - name: kokoro-tts
          image: your-registry/kokoro-tts:latest
          ports:
            - containerPort: 5006
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 5006
          livenessProbe:
            httpGet:
              path: /health
              port: 5006
---
apiVersion: v1
kind: Service
metadata:
  name: kokoro-tts
spec:
  selector:
    app: kokoro-tts
  ports:
    - name: http
      port: 5006
      targetPort: 5006
