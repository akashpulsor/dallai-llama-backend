apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma-vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gemma-vllm
  template:
    metadata:
      labels:
        app: gemma-vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - --model
            - google/gemma-3-4b-it
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --max-model-len
            - "8192"
          ports:
            - containerPort: 8000
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-secrets
                  key: hf-token
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              cpu: "8"
              memory: 24Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gemma-vllm
spec:
  selector:
    app: gemma-vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
