version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-postgres
    environment:
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai123
      POSTGRES_DB: ai_db
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    command: ["postgres", "-c", "timezone=Asia/Kolkata", "-c", "log_timezone=Asia/Kolkata"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: