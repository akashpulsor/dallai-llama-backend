spring:
  application:
    name: video-generation-service

  lifecycle:
    # See llm-gateway's application.yml for why this needs to be this long -- must stay under
    # the pod's terminationGracePeriodSeconds in the Helm chart, or Kubernetes SIGKILLs first.
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_SHUTDOWN_TIMEOUT:210s}

  web:
    cors:
      mapping: "/**"
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
      allowed-headers: ${CORS_ALLOWED_HEADERS:*}
      exposed-headers: Authorization
      allow-credentials: true
      max-age: ${CORS_MAX_AGE:86400}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:video_gen_db}?sslmode=disable
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: ${SHOW_SQL:false}
    open-in-view: false

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: video-generation-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/dalai-llama}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8080/realms/dalai-llama/protocol/openid-connect/certs}}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

video-gen:
  llm-gateway:
    base-url: ${LLM_GATEWAY_BASE_URL:http://llm-gateway.apps.svc.cluster.local:8080}
    default-video-model: ${VIDEO_GEN_DEFAULT_MODEL:seedance-v1}
    default-compression-model: ${VIDEO_GEN_COMPRESSION_MODEL:gemini-2.5-flash}
    timeout-ms: ${VIDEO_GEN_LLM_GATEWAY_TIMEOUT_MS:200000}
  job:
    # Generous on purpose vs. the ~200s gateway timeout above -- also covers the MinIO
    # download+reupload step that runs after dispatch returns, before COMPLETED commits. A
    # false-positive reclaim would incorrectly terminate a genuinely still-running job.
    stale-after-minutes: ${VIDEO_GEN_JOB_STALE_AFTER_MINUTES:15}
    reconciliation-interval-ms: ${VIDEO_GEN_JOB_RECONCILIATION_INTERVAL_MS:120000}
    # Past stale-after-minutes, reconciliation actively re-checks with llm-gateway (same
    # idempotency key -- never a fresh dispatch/charge) instead of assuming crashed. Only past
    # THIS much longer ceiling does it give up unconditionally -- final safety net against a
    # permanently unreachable llm-gateway, not the normal path.
    giveup-after-minutes: ${VIDEO_GEN_JOB_GIVEUP_AFTER_MINUTES:60}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio.infra.svc.cluster.local:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${VIDEO_GEN_EXPORT_BUCKET:creator-assets}
    export-prefix: ${VIDEO_GEN_EXPORT_PREFIX:video-gen-exports}
