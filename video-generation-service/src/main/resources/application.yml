spring:
  application:
    name: video-generation-service

  lifecycle:
    # See llm-gateway's application.yml for why this needs to be this long -- must stay under
    # the pod's terminationGracePeriodSeconds in the Helm chart, or Kubernetes SIGKILLs first.
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_SHUTDOWN_TIMEOUT:210s}

  codec:
    # Spring WebFlux's injected WebClient.Builder defaults to a 256KB in-memory response buffer --
    # LlmGatewayClient's chat() responses can carry base64-encoded generated video/image media
    # that routinely exceeds that, silently truncating instead of decoding the real response
    # (confirmed as the real cause of an equivalent bug in pre-production-service's image
    # generation). 16MB matches creator-service's own GoogleGenAiClientFactory.
    max-in-memory-size: 16MB

  web:
    cors:
      mapping: "/**"
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
      allowed-headers: ${CORS_ALLOWED_HEADERS:*}
      exposed-headers: Authorization
      allow-credentials: true
      max-age: ${CORS_MAX_AGE:86400}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:video_gen_db}?sslmode=disable
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: ${SHOW_SQL:false}
    open-in-view: false

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: video-generation-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
        # A prepare-batch holds one record for as long as the whole project takes to prepare.
        # The 5-minute default would declare the consumer dead mid-batch, rebalance, and hand the
        # same batch to another consumer -- re-running shots that were already prepared and
        # charged for. Well clear of a realistic batch, and the abandoned-job reclaim in
        # PrepareBatchJobService is what covers a worker that genuinely dies.
        max.poll.interval.ms: ${VIDEO_GEN_KAFKA_MAX_POLL_INTERVAL_MS:1800000}
        # One batch at a time per consumer: the shot loop inside is deliberately sequential.
        max.poll.records: 1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/dalai-llama}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8080/realms/dalai-llama/protocol/openid-connect/certs}}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

video-gen:
  # Prepare-scene stage reads pre-production's shot/cast/plan/image material via its
  # /api/v1/internal/** aliases (InternalShotAssemblyController) -- tenantId in the path, no JWT.
  pre-production:
    base-url: ${PRE_PRODUCTION_SERVICE_BASE_URL:http://pre-production-service.apps.svc.cluster.local:8080}
    timeout-ms: ${PRE_PRODUCTION_SERVICE_TIMEOUT_MS:15000}
  # The clip lengths the video models will actually produce. Both are bounds on what can be ASKED
  # for: a request outside them comes back clamped, which would silently be a different duration
  # than the one the fit maths reasoned about.
  min-shot-duration-seconds: ${VIDEO_GEN_MIN_SHOT_DURATION_SECONDS:3}
  max-shot-duration-seconds: ${VIDEO_GEN_MAX_SHOT_DURATION_SECONDS:10}
  # Whether a shot's spoken line fits the clip it is planned for. Reported before generation, where
  # it is still free to fix -- see DialogueFitReportService.
  dialogue-fit:
    model: ${VIDEO_GEN_DIALOGUE_FIT_MODEL:gemini-2.5-flash}
    # Rewriting a creator's line and saving it over theirs, unprompted, during a prepare they asked
    # for for other reasons. Off: the mismatch is now shown to them with both remedies instead.
    auto-apply: ${VIDEO_GEN_DIALOGUE_FIT_AUTO_APPLY:false}
    # Breath left after the last word so a clip does not end on a consonant.
    tail-seconds: ${VIDEO_GEN_DIALOGUE_FIT_TAIL_SECONDS:0.4}
    # Only for a line nobody has synthesized yet, and never reported as a measurement: speaking rate
    # varies by language, by voice and by line, so this is wrong by design. It exists so an undubbed
    # project shows "roughly 12s in an 8s shot, worth checking" rather than a blank.
    estimated-chars-per-second: ${VIDEO_GEN_DIALOGUE_FIT_ESTIMATED_CHARS_PER_SECOND:14}
    probe-timeout-seconds: ${VIDEO_GEN_DIALOGUE_FIT_PROBE_TIMEOUT_SECONDS:60}
  # Prepare-scene max prompt length -- the fallback for models the strategy resolver has no
  # dedicated ProviderPromptStrategy for. Per-model strategies override this.
  provider:
    default-max-prompt-length: ${VIDEO_GEN_DEFAULT_MAX_PROMPT_LENGTH:2000}
  # Prepare-batch runs on this service's own Kafka worker side rather than the request thread.
  # The consumer group IS the concurrency control -- tune parallelism by partition count, not by
  # a thread pool nobody can see or change without a redeploy.
  prepare:
    requested-topic: ${VIDEO_GEN_PREPARE_REQUESTED_TOPIC:videogen.prepare.requested}
    requested-consumer-group: ${VIDEO_GEN_PREPARE_REQUESTED_CONSUMER_GROUP:video-generation-service-prepare-batch}
  dub:
    # Its own topic. Synthesis is a provider call with per-tenant limits, and separating it means
    # its consumer count can be tuned against those limits without changing how fast video renders.
    requested-topic: ${VIDEO_GEN_DUB_REQUESTED_TOPIC:videogen.dub.requested}
    requested-consumer-group: ${VIDEO_GEN_DUB_REQUESTED_GROUP:video-generation-service-dub}
  generation:
    # Its own topic, not shared with prepare. Generation is the expensive, provider-rate-limited
    # call, and keeping it separate means its consumer count can be tuned against the model's
    # limits without also changing how fast prompts are prepared.
    requested-topic: ${VIDEO_GEN_GENERATION_REQUESTED_TOPIC:videogen.generation.requested}
    requested-consumer-group: ${VIDEO_GEN_GENERATION_REQUESTED_GROUP:video-generation-service-generation}
  # The shot's music bed, laid under its finished audio by the container's own ffmpeg. fal's
  # hosted ffmpeg apps take multiple tracks but expose no volume, so a bed mixed there would sit
  # at unity against the dialogue.
  background-music:
    volume: ${VIDEO_GEN_BACKGROUND_MUSIC_VOLUME:0.18}
    ffmpeg-timeout-seconds: ${VIDEO_GEN_BACKGROUND_MUSIC_FFMPEG_TIMEOUT_SECONDS:300}
  # Billing owns the exchange rate a render is quoted at, so the estimate shown to a creator and
  # the debit that follows it cannot drift apart.
  billing:
    base-url: ${BILLING_SERVICE_BASE_URL:http://billing-service.apps.svc.cluster.local:8080}
    timeout-ms: ${VIDEO_GEN_BILLING_TIMEOUT_MS:5000}
    rates-cache-seconds: ${VIDEO_GEN_BILLING_RATES_CACHE_SECONDS:300}
  llm-gateway:
    base-url: ${LLM_GATEWAY_BASE_URL:http://llm-gateway.apps.svc.cluster.local:8080}
    default-video-model: ${VIDEO_GEN_DEFAULT_MODEL:bytedance/seedance-2.0/fast}
    default-compression-model: ${VIDEO_GEN_COMPRESSION_MODEL:gemini-2.5-flash}
    default-voice-clone-model: ${VIDEO_GEN_VOICE_CLONE_MODEL:elevenlabs/instant-voice-clone}
    default-voice-clone-provider-id: ${VIDEO_GEN_VOICE_CLONE_PROVIDER_ID:elevenlabs}
    default-tts-model: ${VIDEO_GEN_TTS_MODEL:elevenlabs-tts-v1}
    default-audio-video-merge-model: ${VIDEO_GEN_AUDIO_VIDEO_MERGE_MODEL:fal-ai/ffmpeg-api/merge-audio-video}
    timeout-ms: ${VIDEO_GEN_LLM_GATEWAY_TIMEOUT_MS:200000}
  job:
    # Generous on purpose vs. the ~200s gateway timeout above -- also covers the MinIO
    # download+reupload step that runs after dispatch returns, before COMPLETED commits. A
    # false-positive reclaim would incorrectly terminate a genuinely still-running job.
    stale-after-minutes: ${VIDEO_GEN_JOB_STALE_AFTER_MINUTES:15}
    reconciliation-interval-ms: ${VIDEO_GEN_JOB_RECONCILIATION_INTERVAL_MS:120000}
    # Past stale-after-minutes, reconciliation actively re-checks with llm-gateway (same
    # idempotency key -- never a fresh dispatch/charge) instead of assuming crashed. Only past
    # THIS much longer ceiling does it give up unconditionally -- final safety net against a
    # permanently unreachable llm-gateway, not the normal path.
    giveup-after-minutes: ${VIDEO_GEN_JOB_GIVEUP_AFTER_MINUTES:60}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio.infra.svc.cluster.local:9000}
    # Presigned URLs handed to fal.ai (reference/source) or the browser (<video src>) sign
    # against this hostname -- must be a route reachable from outside the cluster. Blank
    # falls back to `endpoint` for local/dev. See MinioConfig.publicMinioClient for why the
    # endpoint can't be swapped after signing.
    public-url: ${MINIO_PUBLIC_URL:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${VIDEO_GEN_EXPORT_BUCKET:creator-assets}
    export-prefix: ${VIDEO_GEN_EXPORT_PREFIX:video-gen-exports}
