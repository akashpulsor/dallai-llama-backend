spring:
  application:
    name: pre-production-service

  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_SHUTDOWN_TIMEOUT:210s}

  codec:
    # Spring WebFlux's injected WebClient.Builder defaults to a 256KB in-memory response buffer --
    # LlmGatewayClient's chat() responses carry base64-encoded generated images (shot storyboards,
    # production frames) that routinely exceed that, so the default silently truncates them
    # (DataBufferLimitException) instead of decoding the real response. 16MB matches
    # creator-service's own GoogleGenAiClientFactory, which hit and fixed this exact problem already.
    max-in-memory-size: 16MB

  servlet:
    multipart:
      max-file-size: ${PRE_PROD_MAX_UPLOAD_SIZE_MB:25}MB
      max-request-size: ${PRE_PROD_MAX_UPLOAD_SIZE_MB:25}MB

  web:
    cors:
      mapping: "/**"
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
      allowed-headers: ${CORS_ALLOWED_HEADERS:*}
      exposed-headers: Authorization
      allow-credentials: true
      max-age: ${CORS_MAX_AGE:86400}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pre_production_db}?sslmode=disable
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: ${SHOW_SQL:false}
    open-in-view: false

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/dalai-llama}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8080/realms/dalai-llama/protocol/openid-connect/certs}}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

pre-production:
  llm-gateway:
    base-url: ${LLM_GATEWAY_BASE_URL:http://llm-gateway.apps.svc.cluster.local:8080}
    timeout-ms: ${LLM_GATEWAY_TIMEOUT_MS:120000}
    default-image-model: ${PRE_PROD_DEFAULT_IMAGE_MODEL:gemini-2.5-flash-image}
    # Defaults to Gemini (no separate credential needed) rather than fal.ai's flux-pulid-v1 --
    # confirmed live that FAL_API_KEY was never actually provisioned in this environment, so every
    # identity-conditioned PRODUCTION image (a shot with an assigned cast face or a confirmed
    # product reference) 502'd. Still configurable: a deployment with a real fal.ai key can set
    # this back to flux-pulid-v1 -- see ShotImageService#isGeminiModel for how the request shape
    # adapts to whichever is configured.
    identity-image-model: ${PRE_PROD_IDENTITY_IMAGE_MODEL:gemini-2.5-flash-image}
    default-text-model: ${PRE_PROD_DEFAULT_TEXT_MODEL:gemini-2.5-flash}
    background-music-model: ${PRE_PROD_BACKGROUND_MUSIC_MODEL:elevenlabs/music-v1}
  video-gen:
    base-url: ${VIDEO_GEN_BASE_URL:http://video-generation-service.apps.svc.cluster.local:8080}
    timeout-ms: ${VIDEO_GEN_TIMEOUT_MS:30000}
  critic:
    base-url: ${CRITIC_SERVICE_BASE_URL:http://critic-service.apps.svc.cluster.local:8080}
    timeout-ms: ${CRITIC_SERVICE_TIMEOUT_MS:120000}
  chat:
    base-url: ${CHAT_SERVICE_BASE_URL:http://chat-service.apps.svc.cluster.local:8080}
    timeout-ms: ${CHAT_SERVICE_TIMEOUT_MS:30000}
  tenant:
    base-url: ${TENANT_SERVICE_BASE_URL:http://tenant-service.apps.svc.cluster.local:8080}
    timeout-ms: ${TENANT_SERVICE_TIMEOUT_MS:15000}
  billing:
    base-url: ${BILLING_SERVICE_BASE_URL:http://billing-service.apps.svc.cluster.local:8080}
    # 30s: this is the pay-to-lock verify call, which routes through billing-service to Razorpay's
    # live API -- same reasoning as creative-planning-service's identical bump (see its
    # application.yml), and the same failure mode applies here with no async fallback: unlike
    # requirement funding (which self-heals via billing.payment.received on Kafka once Razorpay's
    # webhook lands), a timed-out lock verify leaves the project permanently unlocked until the
    # client retries -- see ProjectLockService.
    timeout-ms: ${BILLING_SERVICE_TIMEOUT_MS:30000}
  pricing:
    # The platform's own flat rate for a client-facing "pay to lock" charge -- a single number
    # for now (no per-project-type pricing yet). The creator's own ProjectConfig-adjacent
    # Tenant.marginPercent is added on top; only the margin portion credits the creator's wallet
    # (see ClientReviewPaymentService) -- the standard-rate portion is the platform's own take,
    # settled outside this flow for now.
    standard-rate: ${PRE_PROD_STANDARD_RATE:5000}
    currency: ${PRE_PROD_PRICING_CURRENCY:INR}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio.infra.svc.cluster.local:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${PRE_PROD_BUCKET:creator-assets}
    # Real object I/O (put/get/stat) always goes to the internal cluster endpoint above -- only
    # presigned URLs (handed to a browser outside the cluster) need the public one. Blank falls
    # back to the internal endpoint, same convention as creator-service's equivalent property.
    public-url: ${MINIO_PUBLIC_URL:}
    storyboard-prefix: ${PRE_PROD_STORYBOARD_PREFIX:pre-production-storyboards}
    cast-media-prefix: ${PRE_PROD_CAST_MEDIA_PREFIX:pre-production-cast-media}
    export-prefix: ${PRE_PROD_EXPORT_PREFIX:pre-production-exports}
    background-music-prefix: ${PRE_PROD_BACKGROUND_MUSIC_PREFIX:pre-production-background-music}
    review-comment-prefix: ${PRE_PROD_REVIEW_COMMENT_PREFIX:pre-production-review-comments}
  job:
    stale-after-minutes: ${PRE_PROD_JOB_STALE_AFTER_MINUTES:15}
    reconciliation-interval-ms: ${PRE_PROD_JOB_RECONCILIATION_INTERVAL_MS:120000}
  shot-asset-batch:
    # Gap between ShotAssetBatchWorker ticks -- counted from when the previous tick RETURNS, so
    # this is a floor on pacing, not the real cadence: a step's own LLM call (seconds to ~90s)
    # already dominates the gap between generations in practice.
    tick-interval-ms: ${PRE_PROD_SHOT_ASSET_BATCH_TICK_INTERVAL_MS:1000}
