spring:
  application:
    name: creator-service

  web:
    cors:
      mapping: "/**"
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
      allowed-headers: ${CORS_ALLOWED_HEADERS:*}
      exposed-headers: Authorization,Content-Disposition
      allow-credentials: true
      max-age: ${CORS_MAX_AGE:86400}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:creator_db}?sslmode=disable
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: ${SHOW_SQL:false}
    open-in-view: false

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: creator-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/dalai-llama}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8080/realms/dalai-llama/protocol/openid-connect/certs}}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

creator:
  ai:
    provider: ${CREATOR_AI_PROVIDER:openai}
    model: ${CREATOR_AI_MODEL:${OPENAI_LLM_MODEL:gpt-4o-mini}}
    api-key: ${OPENAI_API_KEY:${CREATOR_OPENAI_API_KEY:}}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    gemini-api-key: ${GEMINI_API_KEY:${CREATOR_GEMINI_API_KEY:}}
    gemini-base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    gemini-model: ${GEMINI_MODEL:${CREATOR_GEMINI_MODEL:gemini-2.5-flash}}
    gemini-image-model: ${GEMINI_IMAGE_MODEL:gemini-2.5-flash-image}
    gemini-video-model: ${GEMINI_VIDEO_MODEL:veo-3.1-generate-preview}
    studio-polish-video-provider: ${CREATOR_STUDIO_POLISH_VIDEO_PROVIDER:runway}
    studio-polish-prompt-compaction-enabled: ${CREATOR_STUDIO_POLISH_PROMPT_COMPACTION_ENABLED:true}
    studio-polish-prompt-compaction-google-veo-chars: ${CREATOR_STUDIO_POLISH_PROMPT_COMPACTION_GOOGLE_VEO_CHARS:1800}
    studio-polish-prompt-compaction-luma-chars: ${CREATOR_STUDIO_POLISH_PROMPT_COMPACTION_LUMA_CHARS:1800}
    studio-polish-prompt-compaction-runway-chars: ${CREATOR_STUDIO_POLISH_PROMPT_COMPACTION_RUNWAY_CHARS:900}
    luma-api-key: ${LUMA_API_KEY:${CREATOR_LUMA_API_KEY:}}
    luma-base-url: ${LUMA_BASE_URL:https://api.lumalabs.ai/dream-machine/v1}
    luma-video-model: ${LUMA_VIDEO_MODEL:ray-flash-2}
    luma-video-mode: ${LUMA_VIDEO_MODE:adhere_2}
    luma-video-poll-interval-ms: ${LUMA_VIDEO_POLL_INTERVAL_MS:10000}
    luma-video-timeout-ms: ${LUMA_VIDEO_TIMEOUT_MS:900000}
    provider-credit-check-enabled: ${CREATOR_PROVIDER_CREDIT_CHECK_ENABLED:true}
    luma-low-credit-threshold-usd: ${CREATOR_LUMA_LOW_CREDIT_THRESHOLD_USD:10}
    runway-low-credit-threshold-credits: ${CREATOR_RUNWAY_LOW_CREDIT_THRESHOLD_CREDITS:100}
    runway-api-secret: ${RUNWAY_API_SECRET:${CREATOR_RUNWAY_API_SECRET:}}
    runway-base-url: ${RUNWAY_BASE_URL:https://api.dev.runwayml.com}
    runway-api-version: ${RUNWAY_API_VERSION:2024-11-06}
    runway-video-model: ${RUNWAY_VIDEO_MODEL:aleph2}
    runway-video-poll-interval-ms: ${RUNWAY_VIDEO_POLL_INTERVAL_MS:5000}
    runway-video-timeout-ms: ${RUNWAY_VIDEO_TIMEOUT_MS:900000}
    decart-api-key: ${DECART_API_KEY:${CREATOR_DECART_API_KEY:}}
    decart-base-url: ${DECART_BASE_URL:https://api.decart.ai/v1}
    decart-video-model: ${DECART_VIDEO_MODEL:lucy-vton-3}
    decart-video-resolution: ${DECART_VIDEO_RESOLUTION:720p}
    decart-enhance-prompt: ${DECART_ENHANCE_PROMPT:false}
    decart-video-poll-interval-ms: ${DECART_VIDEO_POLL_INTERVAL_MS:5000}
    decart-video-timeout-ms: ${DECART_VIDEO_TIMEOUT_MS:900000}
    studio-polish-kafka-queue-enabled: ${CREATOR_STUDIO_POLISH_KAFKA_QUEUE_ENABLED:true}
    studio-polish-jobs-topic: ${CREATOR_STUDIO_POLISH_JOBS_TOPIC:creator.studio-polish.jobs}
    studio-polish-consumer-concurrency: ${CREATOR_STUDIO_POLISH_CONSUMER_CONCURRENCY:1}
    studio-polish-topic-partitions: ${CREATOR_STUDIO_POLISH_TOPIC_PARTITIONS:12}
    studio-polish-provider-queue-enabled: ${CREATOR_STUDIO_POLISH_PROVIDER_QUEUE_ENABLED:true}
    studio-polish-provider-queue-max-wait-ms: ${CREATOR_STUDIO_POLISH_PROVIDER_QUEUE_MAX_WAIT_MS:1800000}
    studio-polish-provider-queue-poll-ms: ${CREATOR_STUDIO_POLISH_PROVIDER_QUEUE_POLL_MS:5000}
    runway-max-concurrent-generations: ${RUNWAY_MAX_CONCURRENT_GENERATIONS:${CREATOR_RUNWAY_MAX_CONCURRENT_GENERATIONS:1}}
    runway-max-generations-per-day: ${RUNWAY_MAX_GENERATIONS_PER_DAY:${CREATOR_RUNWAY_MAX_GENERATIONS_PER_DAY:50}}
    luma-max-concurrent-generations: ${LUMA_MAX_CONCURRENT_GENERATIONS:${CREATOR_LUMA_MAX_CONCURRENT_GENERATIONS:10}}
    luma-max-generations-per-day: ${LUMA_MAX_GENERATIONS_PER_DAY:${CREATOR_LUMA_MAX_GENERATIONS_PER_DAY:1000}}
    decart-max-concurrent-generations: ${DECART_MAX_CONCURRENT_GENERATIONS:${CREATOR_DECART_MAX_CONCURRENT_GENERATIONS:1}}
    decart-max-generations-per-day: ${DECART_MAX_GENERATIONS_PER_DAY:${CREATOR_DECART_MAX_GENERATIONS_PER_DAY:100}}
    google-veo-max-concurrent-generations: ${GOOGLE_VEO_MAX_CONCURRENT_GENERATIONS:${CREATOR_GOOGLE_VEO_MAX_CONCURRENT_GENERATIONS:1}}
    google-veo-max-generations-per-day: ${GOOGLE_VEO_MAX_GENERATIONS_PER_DAY:${CREATOR_GOOGLE_VEO_MAX_GENERATIONS_PER_DAY:50}}
    google-genai-backend: ${CREATOR_GOOGLE_GENAI_BACKEND:${GOOGLE_GENAI_BACKEND:ai_studio}}
    google-cloud-project-id: ${GOOGLE_CLOUD_PROJECT_ID:${GOOGLE_CLOUD_PROJECT:}}
    google-cloud-location: ${GOOGLE_CLOUD_LOCATION:us-central1}
    lyria-music-generation-enabled: ${LYRIA_MUSIC_GENERATION_ENABLED:true}
    lyria-music-model: ${LYRIA_MUSIC_MODEL:lyria-3-clip-preview}
    gemini-video-resolution: ${GEMINI_VIDEO_RESOLUTION:1080p}
    gemini-video-duration-seconds: ${GEMINI_VIDEO_DURATION_SECONDS:8}
    gemini-video-person-generation: ${GEMINI_VIDEO_PERSON_GENERATION:allow_adult}
    shot-video-generation-enabled: ${CREATOR_SHOT_VIDEO_GENERATION_ENABLED:true}
    gemini-video-poll-interval-ms: ${GEMINI_VIDEO_POLL_INTERVAL_MS:10000}
    gemini-video-timeout-ms: ${GEMINI_VIDEO_TIMEOUT_MS:900000}
    storyboard-image-generation-enabled: ${CREATOR_STORYBOARD_IMAGE_GENERATION_ENABLED:true}
    timeout-ms: ${CREATOR_AI_TIMEOUT_MS:60000}
    max-output-tokens: ${CREATOR_AI_MAX_OUTPUT_TOKENS:32768}
    gemini-max-attempts: ${CREATOR_GEMINI_MAX_ATTEMPTS:3}
    gemini-retry-backoff-ms: ${CREATOR_GEMINI_RETRY_BACKOFF_MS:1000}
    gemini-retry-max-delay-ms: ${CREATOR_GEMINI_RETRY_MAX_DELAY_MS:30000}
    gemini-rate-limit-cooldown-ms: ${CREATOR_GEMINI_RATE_LIMIT_COOLDOWN_MS:60000}
    gemini-rate-limit-max-cooldown-ms: ${CREATOR_GEMINI_RATE_LIMIT_MAX_COOLDOWN_MS:300000}
    gemini-rate-limit-max-local-wait-ms: ${CREATOR_GEMINI_RATE_LIMIT_MAX_LOCAL_WAIT_MS:5000}
    gemini-request-min-interval-ms: ${CREATOR_GEMINI_REQUEST_MIN_INTERVAL_MS:1000}
    audio-neural-denoise-enabled: ${CREATOR_AUDIO_NEURAL_DENOISE_ENABLED:true}
    audio-neural-denoise-provider: ${CREATOR_AUDIO_NEURAL_DENOISE_PROVIDER:deepfilter}
    audio-neural-denoise-fail-on-missing: ${CREATOR_AUDIO_NEURAL_DENOISE_FAIL_ON_MISSING:false}
    deep-filter-command: ${CREATOR_DEEPFILTER_COMMAND:deep-filter}
    deep-filter-model-path: ${CREATOR_DEEPFILTER_MODEL_PATH:}
    deep-filter-post-filter-enabled: ${CREATOR_DEEPFILTER_POST_FILTER_ENABLED:true}
    rnnoise-command: ${CREATOR_RNNOISE_COMMAND:rnnoise_demo}
    ffmpeg-arnndn-model-path: ${CREATOR_FFMPEG_ARNNDN_MODEL_PATH:}
    billing:
      enabled: ${CREATOR_AI_BILLING_ENABLED:true}
      token-rate: ${CREATOR_AI_TOKEN_RATE:0.0001}
      minimum-charge: ${CREATOR_AI_MINIMUM_CHARGE:0}
      currency: ${CREATOR_AI_BILLING_CURRENCY:INR}
      audio-enhancement-rate-per-minute-usd: ${CREATOR_AUDIO_ENHANCEMENT_RATE_PER_MINUTE_USD:0.02}
      usage-markup-percent: ${CREATOR_AI_USAGE_MARKUP_PERCENT:80}
  billing:
    wallet-guard-enabled: ${CREATOR_WALLET_GUARD_ENABLED:true}
    minimum-wallet-balance: ${CREATOR_MINIMUM_WALLET_BALANCE:100}
    wallet-check-timeout-ms: ${CREATOR_WALLET_CHECK_TIMEOUT_MS:3000}
  jobs:
    ttl-seconds: ${CREATOR_JOB_TTL_SECONDS:86400}
  kafka:
    generation-jobs-topic: ${CREATOR_KAFKA_GENERATION_JOBS_TOPIC:creator.generation.jobs}
    billing-events-topic: ${CREATOR_KAFKA_BILLING_EVENTS_TOPIC:creator.billing.events}
    analytics-events-topic: ${CREATOR_KAFKA_ANALYTICS_EVENTS_TOPIC:creator.analytics.events}
  connectors:
    reddit:
      client-id: ${REDDIT_CLIENT_ID:${CREATOR_REDDIT_CLIENT_ID:}}
      client-secret: ${REDDIT_CLIENT_SECRET:${CREATOR_REDDIT_CLIENT_SECRET:}}
      user-agent: ${REDDIT_USER_AGENT:${CREATOR_REDDIT_USER_AGENT:DalaiLlamaCreatorBot/1.0}}
      token-url: ${REDDIT_TOKEN_URL:https://www.reddit.com/api/v1/access_token}
      api-base-url: ${REDDIT_API_BASE_URL:https://oauth.reddit.com}
      token-refresh-skew-seconds: ${REDDIT_TOKEN_REFRESH_SKEW_SECONDS:60}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    creator-assets-bucket: ${MINIO_BUCKET_CREATOR_ASSETS:creator-assets}
    creator-exports-bucket: ${MINIO_BUCKET_CREATOR_EXPORTS:creator-exports}
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
    signed-url-ttl-seconds: ${MINIO_SIGNED_URL_TTL_SECONDS:3600}
  services:
    tenant-url: ${TENANT_SERVICE_URL:http://localhost:8081}
    product-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
    billing-url: ${BILLING_SERVICE_URL:http://localhost:8083}
  trends:
    scheduler:
      enabled: ${CREATOR_TREND_SCHEDULER_ENABLED:false}
      fixed-delay-ms: ${CREATOR_TREND_SCHEDULER_FIXED_DELAY_MS:1800000}
      initial-delay-ms: ${CREATOR_TREND_SCHEDULER_INITIAL_DELAY_MS:60000}
      window-minutes: ${CREATOR_TREND_SCHEDULER_WINDOW_MINUTES:30}
      country-code: ${CREATOR_TREND_SCHEDULER_COUNTRY_CODE:IN}
      retry-count: ${CREATOR_TREND_SCHEDULER_RETRY_COUNT:2}
      retry-backoff-ms: ${CREATOR_TREND_SCHEDULER_RETRY_BACKOFF_MS:60000}
  weekly-ideas:
    scheduler:
      enabled: ${CREATOR_WEEKLY_IDEA_SCHEDULER_ENABLED:true}
      initial-delay-ms: ${CREATOR_WEEKLY_IDEA_SCHEDULER_INITIAL_DELAY_MS:60000}
      fixed-delay-ms: ${CREATOR_WEEKLY_IDEA_SCHEDULER_FIXED_DELAY_MS:1296000000}
      retry-count: ${CREATOR_WEEKLY_IDEA_SCHEDULER_RETRY_COUNT:2}
      retry-backoff-ms: ${CREATOR_WEEKLY_IDEA_SCHEDULER_RETRY_BACKOFF_MS:60000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.dalai.llama.creator: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.springframework.kafka: WARN
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.dalai.llama.creator: INFO

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:creator_test
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
