spring:
  application:
    name: creator-service

  web:
    cors:
      mapping: "/**"
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
      allowed-headers: ${CORS_ALLOWED_HEADERS:*}
      exposed-headers: Authorization,Content-Disposition
      allow-credentials: true
      max-age: ${CORS_MAX_AGE:86400}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:creator_db}?sslmode=disable
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: ${SHOW_SQL:false}
    open-in-view: false

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: creator-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/dalai-llama}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8080/realms/dalai-llama/protocol/openid-connect/certs}}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

creator:
  ai:
    provider: ${CREATOR_AI_PROVIDER:openai}
    model: ${CREATOR_AI_MODEL:${OPENAI_LLM_MODEL:gpt-4o-mini}}
    api-key: ${OPENAI_API_KEY:${CREATOR_OPENAI_API_KEY:}}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    gemini-api-key: ${GEMINI_API_KEY:${CREATOR_GEMINI_API_KEY:}}
    gemini-base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    gemini-model: ${GEMINI_MODEL:${CREATOR_GEMINI_MODEL:gemini-2.5-flash}}
    gemini-image-model: ${GEMINI_IMAGE_MODEL:imagen-3.0-generate-001}
    storyboard-image-generation-enabled: ${CREATOR_STORYBOARD_IMAGE_GENERATION_ENABLED:true}
    timeout-ms: ${CREATOR_AI_TIMEOUT_MS:60000}
    max-output-tokens: ${CREATOR_AI_MAX_OUTPUT_TOKENS:32768}
    billing:
      enabled: ${CREATOR_AI_BILLING_ENABLED:true}
      token-rate: ${CREATOR_AI_TOKEN_RATE:0.0001}
      minimum-charge: ${CREATOR_AI_MINIMUM_CHARGE:0}
      currency: ${CREATOR_AI_BILLING_CURRENCY:INR}
  billing:
    wallet-guard-enabled: ${CREATOR_WALLET_GUARD_ENABLED:true}
    minimum-wallet-balance: ${CREATOR_MINIMUM_WALLET_BALANCE:100}
    wallet-check-timeout-ms: ${CREATOR_WALLET_CHECK_TIMEOUT_MS:3000}
  jobs:
    ttl-seconds: ${CREATOR_JOB_TTL_SECONDS:86400}
  kafka:
    generation-jobs-topic: ${CREATOR_KAFKA_GENERATION_JOBS_TOPIC:creator.generation.jobs}
    billing-events-topic: ${CREATOR_KAFKA_BILLING_EVENTS_TOPIC:creator.billing.events}
    analytics-events-topic: ${CREATOR_KAFKA_ANALYTICS_EVENTS_TOPIC:creator.analytics.events}
  connectors:
    reddit:
      client-id: ${REDDIT_CLIENT_ID:${CREATOR_REDDIT_CLIENT_ID:}}
      client-secret: ${REDDIT_CLIENT_SECRET:${CREATOR_REDDIT_CLIENT_SECRET:}}
      user-agent: ${REDDIT_USER_AGENT:${CREATOR_REDDIT_USER_AGENT:DalaiLlamaCreatorBot/1.0}}
      token-url: ${REDDIT_TOKEN_URL:https://www.reddit.com/api/v1/access_token}
      api-base-url: ${REDDIT_API_BASE_URL:https://oauth.reddit.com}
      token-refresh-skew-seconds: ${REDDIT_TOKEN_REFRESH_SKEW_SECONDS:60}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    creator-assets-bucket: ${MINIO_BUCKET_CREATOR_ASSETS:creator-assets}
    creator-exports-bucket: ${MINIO_BUCKET_CREATOR_EXPORTS:creator-exports}
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
    signed-url-ttl-seconds: ${MINIO_SIGNED_URL_TTL_SECONDS:3600}
  services:
    tenant-url: ${TENANT_SERVICE_URL:http://localhost:8081}
    product-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
    billing-url: ${BILLING_SERVICE_URL:http://localhost:8083}
  trends:
    scheduler:
      enabled: ${CREATOR_TREND_SCHEDULER_ENABLED:false}
      fixed-delay-ms: ${CREATOR_TREND_SCHEDULER_FIXED_DELAY_MS:1800000}
      initial-delay-ms: ${CREATOR_TREND_SCHEDULER_INITIAL_DELAY_MS:60000}
      window-minutes: ${CREATOR_TREND_SCHEDULER_WINDOW_MINUTES:30}
      country-code: ${CREATOR_TREND_SCHEDULER_COUNTRY_CODE:IN}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.dalai.llama.creator: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.springframework.kafka: WARN
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.dalai.llama.creator: INFO

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:creator_test
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
